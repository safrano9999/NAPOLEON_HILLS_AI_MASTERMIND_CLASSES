# Source of truth: SCRIPTS/githubactions. Generated copies are overwritten.
name: Napoleon container image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Container image tag to publish. Empty uses YYYY.M.D."
        required: false
        default: ""
      push_latest:
        description: "Also publish the container image as :latest."
        required: true
        type: boolean
        default: true

concurrency:
  group: ${{ startsWith(github.ref, 'refs/tags/20') && format('release-{0}', github.repository) || github.run_id }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
      packages: write
    env:
      IMAGE_NAME: ghcr.io/safrano9999/napoleon-hills-ai-mastermind-classes
      DOCKER_BUILD_RECORD_UPLOAD: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            version="${GITHUB_REF_NAME}"
          else
            version="${{ inputs.image_tag }}"
            if [ -z "$version" ]; then
              version="$(date +%Y.%-m.%-d)"
            fi
          fi
          {
            echo "version=$version"
            echo "tags<<EOF"
            echo "${IMAGE_NAME}:${version}"
            if [ "${{ github.event_name == 'push' || inputs.push_latest }}" = "true" ]; then
              echo "${IMAGE_NAME}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          cache-binary: false
          keep-state: false
          cleanup: true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          pull: true
          no-cache: true
          push: true
          tags: ${{ steps.tags.outputs.tags }}

      - name: Verify private GHCR package
        env:
          GH_TOKEN: ${{ secrets.GHCR_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          package_url="https://api.github.com/user/packages/container/napoleon-hills-ai-mastermind-classes"
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$package_url" \
            | jq -e \
              '.name == "napoleon-hills-ai-mastermind-classes" and .visibility == "private"' \
              >/dev/null
